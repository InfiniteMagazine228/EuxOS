name: Build EuxOS GUI ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download Debian XFCE Live ISO
        run: |
          mkdir -p out
          cd out
          wget -O index.html https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/
          ISO_URL=$(grep -o 'href="[^"]*amd64-xfce.iso"' index.html | head -n 1 | sed 's/href="//;s/"//')
          echo "Found ISO: $ISO_URL"
          wget -O EuxOS-GUI.iso "https://cdimage.debian.org/debian-cd/current-live/amd64/iso-hybrid/$ISO_URL"
          ls -lh EuxOS-GUI.iso

      - name: Upload EuxOS GUI ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-GUI-ISO
          path: out/EuxOS-GUI.iso

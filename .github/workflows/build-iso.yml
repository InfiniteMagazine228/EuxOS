name: Build EuxOS GUI ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y live-build

      - name: Create EuxOS GUI live config
        run: |
          mkdir -p euxos-gui
          cd euxos-gui

          lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --bootappend-live "boot=live components quiet splash username=euxos hostname=euxos"

          mkdir -p config/package-lists

          cat > config/package-lists/euxos-gui.list.chroot <<'EOF'
          linux-image-amd64
          live-boot
          live-config
          systemd-sysv
          xorg
          xfce4
          xfce4-terminal
          thunar
          lightdm
          lightdm-gtk-greeter
          network-manager
          firefox-esr
          sudo
          neofetch
          htop
          nano
          curl
          wget
          EOF

          mkdir -p config/includes.chroot/etc/lightdm/lightdm.conf.d
          cat > config/includes.chroot/etc/lightdm/lightdm.conf.d/euxos-autologin.conf <<'EOF'
          [Seat:*]
          autologin-user=euxos
          autologin-user-timeout=0
          user-session=xfce
          EOF

          mkdir -p config/includes.chroot/etc
          cat > config/includes.chroot/etc/issue <<'EOF'
          EuxOS GUI Preview 0.2
          Private. Smart. Fluid.
          EOF

          mkdir -p config/includes.chroot/usr/share/backgrounds
          cat > config/includes.chroot/usr/share/backgrounds/euxos-wallpaper.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">
            <defs>
              <radialGradient id="g1" cx="20%" cy="20%" r="60%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0f172a"/>
              </radialGradient>
              <radialGradient id="g2" cx="80%" cy="30%" r="60%">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="100%" height="100%" fill="url(#g1)"/>
            <rect width="100%" height="100%" fill="url(#g2)"/>
            <text x="90" y="160" fill="white" font-family="Arial, sans-serif" font-size="82" font-weight="700">EuxOS</text>
            <text x="94" y="220" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="30">GUI Preview 0.2</text>
            <text x="94" y="270" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24">Private. Smart. Fluid.</text>
          </svg>
          EOF

          mkdir -p config/includes.chroot/etc/skel/Desktop
          cat > config/includes.chroot/etc/skel/Desktop/EuxOS-Welcome.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=EuxOS Welcome
          Comment=Open EuxOS welcome terminal
          Exec=xfce4-terminal --hold --command "bash -c 'clear; echo EuxOS GUI Preview 0.2; echo; echo Welcome to EuxOS.; echo; neofetch; exec bash'"
          Icon=utilities-terminal
          Terminal=false
          EOF

          chmod +x config/includes.chroot/etc/skel/Desktop/EuxOS-Welcome.desktop

      - name: Build EuxOS GUI ISO
        run: |
          cd euxos-gui
          sudo lb build
          mv live-image-amd64.hybrid.iso ../EuxOS-GUI.iso

      - name: Check ISO
        run: ls -lh EuxOS-GUI.iso

      - name: Upload EuxOS GUI ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-GUI-ISO
          path: EuxOS-GUI.iso

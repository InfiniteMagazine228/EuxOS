name: Build EuxOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            isolinux \
            syslinux-common \
            busybox-static \
            cpio \
            gzip \
            linux-image-generic \
            dos2unix

      - name: Fix script line endings
        run: dos2unix build-euxos.sh

      - name: Make script executable
        run: chmod +x build-euxos.sh

      - name: Build ISO
        run: sudo DEBIAN_FRONTEND=noninteractive ./build-euxos.sh

      - name: Upload EuxOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-ISO
          path: EuxOS.iso

name: Build EuxOS Tiny GUI ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-tiny-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download TinyCore GUI ISO
        run: |
          mkdir -p out
          cd out
          wget -O EuxOS-Tiny-GUI.iso https://tinycorelinux.net/16.x/x86/release/TinyCore-current.iso
          ls -lh EuxOS-Tiny-GUI.iso

      - name: Upload EuxOS Tiny GUI ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-Tiny-GUI-ISO
          path: out/EuxOS-Tiny-GUI.iso

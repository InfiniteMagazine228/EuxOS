name: Build EuxOS Tiny GUI ISO

on:
  workflow_dispatch:

jobs:
  build-tiny-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download TinyCore GUI ISO from mirror
        run: |
          mkdir -p out
          cd out
          wget --timeout=30 --tries=3 -O EuxOS-Tiny-GUI.iso https://mirrors.dotsrc.org/tinycorelinux/16.x/x86/release/TinyCore-current.iso
          ls -lh EuxOS-Tiny-GUI.iso

      - name: Upload EuxOS Tiny GUI ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-Tiny-GUI-ISO
          path: out/EuxOS-Tiny-GUI.iso

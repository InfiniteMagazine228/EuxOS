name: Build EuxOS Visual ISO v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget xorriso p7zip-full cpio gzip imagemagick

      - name: Download TinyCore
        run: |
          rm -rf work
          mkdir -p work
          wget -O work/base.iso https://mirrors.dotsrc.org/tinycorelinux/16.x/x86/release/TinyCore-current.iso

      - name: Extract ISO
        run: |
          mkdir -p work/iso
          7z x work/base.iso -owork/iso

      - name: Create EuxOS overlay initrd
        run: |
          mkdir -p work/overlay/etc/skel/.X.d
          mkdir -p work/overlay/etc/skel/euxos
          mkdir -p work/overlay/opt/backgrounds
          mkdir -p work/overlay/etc

          cat > /tmp/euxos-wallpaper.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#050814"/>
                <stop offset="45%" stop-color="#0b1020"/>
                <stop offset="100%" stop-color="#1e1b4b"/>
              </linearGradient>
              <radialGradient id="g1" cx="18%" cy="20%" r="50%">
                <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="g2" cx="82%" cy="30%" r="45%">
                <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <rect width="100%" height="100%" fill="url(#bg)"/>
            <rect width="100%" height="100%" fill="url(#g1)"/>
            <rect width="100%" height="100%" fill="url(#g2)"/>

            <text x="90" y="180" fill="#eaf2ff" font-family="Arial" font-size="92" font-weight="700">EuxOS</text>
            <text x="96" y="235" fill="#94a3b8" font-family="Arial" font-size="30">Private. Smart. Fluid.</text>
            <text x="98" y="290" fill="#38bdf8" font-family="Arial" font-size="22">Visual Preview 1.0</text>

            <rect x="90" y="340" width="430" height="130" rx="24" fill="#020617" fill-opacity="0.55" stroke="#334155"/>
            <text x="125" y="395" fill="#f8fafc" font-family="Arial" font-size="30">Welcome to EuxOS</text>
            <text x="125" y="435" fill="#cbd5e1" font-family="Arial" font-size="20">Minimal • Fast • AI-native</text>
          </svg>
          EOF

          convert /tmp/euxos-wallpaper.svg work/overlay/opt/backgrounds/euxos-wallpaper.png

          cat > work/overlay/etc/skel/euxos/welcome.txt <<'EOF'
          ========================================
                        EuxOS
                  Private. Smart. Fluid.
          ========================================

          Welcome to EuxOS Visual Preview 1.0

          This build is branded as EuxOS:
          - Custom EuxOS wallpaper
          - EuxOS startup welcome
          - Lightweight GUI base
          EOF

          cat > work/overlay/etc/skel/.X.d/euxos-startup <<'EOF'
          #!/bin/sh

          (
            sleep 2

            if command -v setbackground >/dev/null 2>&1; then
              setbackground /opt/backgrounds/euxos-wallpaper.png
            elif command -v wallpaper >/dev/null 2>&1; then
              wallpaper /opt/backgrounds/euxos-wallpaper.png
            elif command -v xli >/dev/null 2>&1; then
              xli -onroot -fillscreen /opt/backgrounds/euxos-wallpaper.png
            fi

            if command -v xterm >/dev/null 2>&1; then
              xterm -T "Welcome to EuxOS" -geometry 80x20+80+80 -e sh -c "cat /home/tc/euxos/welcome.txt; echo; echo Press ENTER to close; read x"
            fi
          ) &
          EOF

          chmod +x work/overlay/etc/skel/.X.d/euxos-startup

          echo "euxos" > work/overlay/etc/hostname

          cd work/overlay
          find . | cpio -o -H newc | gzip -9 > ../iso/boot/euxos.gz

      - name: Patch boot menu safely
        run: |
          echo "Listing boot config files:"
          find work/iso/boot -type f | sort

          if [ -f work/iso/boot/isolinux/isolinux.cfg ]; then
            sed -i 's/TinyCore/EuxOS Visual/g' work/iso/boot/isolinux/isolinux.cfg || true
            sed -i 's/Tiny Core/EuxOS Visual/g' work/iso/boot/isolinux/isolinux.cfg || true
            sed -i 's|/boot/core.gz|/boot/core.gz,/boot/euxos.gz|g' work/iso/boot/isolinux/isolinux.cfg || true
            cat work/iso/boot/isolinux/isolinux.cfg
          fi

      - name: Rebuild EuxOS ISO
        run: |
          cd work/iso
          sudo xorriso -as mkisofs \
            -o ../EuxOS-Visual-v3.iso \
            -b boot/isolinux/isolinux.bin \
            -c boot/isolinux/boot.cat \
            -no-emul-boot \
            -boot-load-size 4 \
            -boot-info-table \
            -V "EUXOS_VISUAL" \
            .
          cd ..
          ls -lh EuxOS-Visual-v3.iso

      - name: Upload EuxOS Visual ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-Visual-v3-ISO
          path: work/EuxOS-Visual-v3.iso

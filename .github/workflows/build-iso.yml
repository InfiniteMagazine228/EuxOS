name: Build EuxOS GUI ISO

on:
  workflow_dispatch:

jobs:
  build-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install live-build
        run: |
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y live-build

      - name: Create EuxOS GUI config
        run: |
          mkdir euxos-gui
          cd euxos-gui

          lb config \
            --distribution bookworm \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --debian-installer none \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet username=euxos hostname=euxos"

          mkdir -p config/package-lists

          cat > config/package-lists/euxos.list.chroot <<'EOF'
          task-xfce-desktop
          lightdm
          network-manager
          sudo
          nano
          htop
          neofetch
          firefox-esr
          EOF

          mkdir -p config/includes.chroot/etc
          cat > config/includes.chroot/etc/issue <<'EOF'
          EuxOS GUI Preview 0.2
          Private. Smart. Fluid.
          EOF

      - name: Build ISO
        run: |
          cd euxos-gui
          sudo lb build
          ls -lh
          cp live-image-amd64.hybrid.iso ../EuxOS-GUI.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: EuxOS-GUI-ISO
          path: EuxOS-GUI.iso
